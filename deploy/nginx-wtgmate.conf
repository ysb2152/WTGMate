# WTGMate nginx 설정 (단일 EC2: 정적 프론트 서빙 + /api 리버스 프록시 + HTTPS).
#
# 배포:
#   1) 프론트 빌드: cd frontend && VITE_API_BASE_URL="" npm run build  (동일 오리진이라 상대 /api)
#      => frontend/dist 를 /var/www/wtgmate 로 복사.
#   2) 이 파일을 /etc/nginx/sites-available/wtgmate 로 복사하고 YOUR_DOMAIN 치환, sites-enabled 링크.
#   3) sudo nginx -t && sudo systemctl reload nginx
#   4) sudo certbot --nginx -d YOUR_DOMAIN   (443 서버블록 + HTTP→HTTPS 리다이렉트 자동 삽입)
#
# 프론트와 /api가 같은 도메인이라 CORS도 필요 없다(백엔드 ALLOWED_ORIGINS는 그대로 둬도 무방).

server {
    listen 80;
    server_name YOUR_DOMAIN;   # 예: wtgmate.example.com

    # vite build 산출물(frontend/dist) 배포 위치.
    root /var/www/wtgmate;
    index index.html;

    # SPA: 정적 파일 없으면 index.html로 폴백.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드(FastAPI, docker-compose가 8000 노출) 리버스 프록시.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 파싱/최적화 대기 여유(브루트포스·OR-Tools 포함).
        proxy_read_timeout 120s;
    }
}
